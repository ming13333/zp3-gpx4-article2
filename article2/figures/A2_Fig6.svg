<text x="776.0" y="139.4" font-size="9.0" text-anchor="middle" fill="#c0392b" font-weight="bold" font-family="Arial, Helvetica, sans-serif">difference -1,517</text>
<text x="776.0" y="127.4" font-size="8.2" text-anchor="middle" fill="#c0392b" font-weight="normal" font-family="Arial, Helvetica, sans-serif">95% CI -3,423 to +149</text>
<text x="776.0" y="541.1" font-size="9.2" text-anchor="middle" fill="#555" font-weight="normal" font-family="Arial, Helvetica, sans-serif">excess = observed - null mean</text>
<text x="40.0" y="596.0" font-size="9.8" xml:space="preserve" font-family="Arial, Helvetica, sans-serif"><tspan font-weight="bold" fill="#222">Pseudo-replication is real and quantified: </tspan><tspan font-weight="normal" fill="#333">under naive pooling the null share of the nominal 5% threshold doubles to 10.1%, so the same test</tspan></text>
<text x="40.0" y="610.0" font-size="9.8" xml:space="preserve" font-family="Arial, Helvetica, sans-serif"><tspan font-weight="normal" fill="#333"></tspan><tspan font-weight="normal" fill="#333">over-reports "significant" genes roughly twofold when the null is true.</tspan></text>
<text x="40.0" y="624.0" font-size="9.8" xml:space="preserve" font-family="Arial, Helvetica, sans-serif"><tspan font-weight="bold" fill="#222">The mechanism is the analysis unit, not patient composition: </tspan><tspan font-weight="normal" fill="#333">holding the 42 paired patients fixed, pooling alone</tspan></text>
<text x="40.0" y="638.0" font-size="9.8" xml:space="preserve" font-family="Arial, Helvetica, sans-serif"><tspan font-weight="normal" fill="#333"></tspan><tspan font-weight="normal" fill="#333">moves the null share from 4.52% to 11.32% (pre-only 4.56%).</tspan></text>
<text x="40.0" y="652.0" font-size="9.8" xml:space="preserve" font-family="Arial, Helvetica, sans-serif"><tspan font-weight="bold" fill="#222">The rise in gene counts is dominated by genuine on-treatment biology: </tspan><tspan font-weight="normal" fill="#333">on-treatment samples alone give 4,015 genes</tspan></text>
<text x="40.0" y="666.0" font-size="9.8" xml:space="preserve" font-family="Arial, Helvetica, sans-serif"><tspan font-weight="normal" fill="#333"></tspan><tspan font-weight="normal" fill="#333">at P&lt;0.05 (permutation P=0.0016; excess +2,929) on a valid 4.9% null floor.</tspan></text>
<text x="40.0" y="680.0" font-size="9.8" xml:space="preserve" font-family="Arial, Helvetica, sans-serif"><tspan font-weight="bold" fill="#222">The accompanying fall in excess (to +2,083) is directional but not resolved: </tspan><tspan font-weight="normal" fill="#333">its 95% CI includes zero, so it is</tspan></text>
<text x="40.0" y="694.0" font-size="9.8" xml:space="preserve" font-family="Arial, Helvetica, sans-serif"><tspan font-weight="normal" fill="#333"></tspan><tspan font-weight="normal" fill="#333">reported as exploratory rather than as an established second effect.</tspan></text>
</svg>