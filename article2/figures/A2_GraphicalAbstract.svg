  <title
     id="ga-title">ZP3 is not reproducibly associated with ICB response</title>
  <desc
     id="ga-desc">Three-panel graphical abstract: candidate hypothesis (ZP3 - immune context - ICB response), three-cohort validation with pre-treatment effect sizes and 95% confidence intervals (GSE78220 r=-0.03, IMvigor210 r=-0.015, GSE91061 pre-treatment r=-0.19; all not significant), robustness testing showing the apparent on-treatment-inclusive signal is absent from all pre-treatment analysis frameworks, and the conclusion that ZP3 was not reproducibly associated with ICB response in pre-treatment cohorts.</desc>
