<text x="40.0" y="627.0" font-size="8.8" text-anchor="start" fill="#333" font-weight="normal" font-family="Arial, Helvetica, sans-serif">The patient-level result depends on the aggregation rule (pre-else-on P=0.175 vs mean-aggregate P=0.054); no aggregation rule reaches P&lt;0.05.</text>
