<text x="40.0" y="601.0" font-size="8.8" text-anchor="start" fill="#333" font-weight="normal" font-family="Arial, Helvetica, sans-serif">repeated measures) leaves the on-treatment-only association significant (P=0.013) but weakens the pooled association (P=0.028), and returns P=0.357 for the</text>
